<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Cute Shop ♡</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,"Noto Sans Thai",sans-serif;
  background:#fff7fb;
  color:#665761
}

button,input,select,textarea{font:inherit}
button{cursor:pointer}

header{display:none}

.menu-button{
  width:45px;
  height:45px;
  border:0;
  border-radius:15px;
  background:#fff0f6;
  color:#dc82a8;
  font-size:22px
}

.menu-button:hover{background:#ffdcea}

.side-menu{
  position:fixed;
  top:0;
  right:-330px;
  width:310px;
  height:100vh;
  background:#fff;
  z-index:200;
  padding:25px;
  box-shadow:-5px 0 25px rgba(80,40,60,.12);
  transition:.3s
}

.side-menu.open{right:0}

.menu-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-size:20px;
  font-weight:bold;
  margin-bottom:25px
}

.close-menu{
  border:0;
  background:#fff0f6;
  color:#d883a5;
  width:35px;
  height:35px;
  border-radius:12px
}

.menu-item{
  width:100%;
  border:0;
  background:#fff7fa;
  color:#806b74;
  padding:15px;
  margin-bottom:10px;
  border-radius:15px;
  text-align:left;
  font-size:14px
}

.menu-item:hover{background:#ffe4ef}

.container{
  padding:0 18px 100px
}

.page{min-height:100vh}

.home-page{padding-bottom:105px}

.profile-banner{
  height:220px;
  margin:0;
  background:#ffddea;
  position:relative;
  overflow:hidden;
  background-size:cover;
  background-position:center
}

.profile-banner::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    to bottom,
    rgba(0,0,0,.03),
    rgba(0,0,0,.12)
  )
}

.profile-nav{
  position:absolute;
  top:12px;
  left:0;
  right:0;
  z-index:2;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  padding:0 14px
}

.profile-label{
  color:white;
  font-weight:bold;
  text-shadow:0 1px 5px rgba(0,0,0,.25)
}

.profile-nav .menu-button{
  justify-self:end;
  background:rgba(255,255,255,.88)
}

.profile-head{
  display:flex;
  align-items:center;
  gap:13px;
  padding:0 18px;
  margin-top:-40px;
  position:relative;
  z-index:3
}

.profile-avatar{
  width:88px;
  height:88px;
  border-radius:50%;
  object-fit:cover;
  background:#ffe5ef;
  border:4px solid white;
  box-shadow:0 3px 15px rgba(80,40,60,.14)
}

.profile-name{
  font-size:20px;
  font-weight:bold;
  color:#6f5a64;
  overflow-wrap:anywhere;
  padding-top:28px
}

.profile-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  padding:12px 18px 16px
}

.profile-action{
  border:1px solid #ead7df;
  background:#fff;
  border-radius:13px;
  padding:11px;
  color:#806b74;
  font-weight:bold
}

.profile-action:hover{background:#fff0f6}

.profile-divider{border-top:1px solid #eadbe2}

.home-links{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  padding:14px 18px
}

.home-link-btn{
  border:1px solid #ead7df;
  background:#fff;
  border-radius:13px;
  padding:12px 8px;
  color:#806b74;
  font-weight:bold
}

.home-link-btn:hover{background:#fff0f6}

.home-link-buttons{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  padding:14px 18px 8px
}

.cart-badge{
  display:inline-flex;
  min-width:18px;
  height:18px;
  padding:0 5px;
  align-items:center;
  justify-content:center;
  border-radius:999px;
  background:#f49bc0;
  color:#fff;
  font-size:10px;
  font-weight:bold;
  vertical-align:middle
}

.cart-nav-wrap{
  position:relative
}

.cart-nav-wrap .cart-badge{
  position:absolute;
  top:-3px;
  right:5px;
  line-height:18px;
  text-align:center
}

.home-product-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:2px;
  background:#fff
}

.home-grid-item{
  aspect-ratio:1/1;
  border:0;
  padding:0;
  overflow:hidden;
  background:#fff0f6;
  position:relative
}

.home-grid-item img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block
}

.search{
  width:100%;
  border:0;
  outline:0;
  background:#fff;
  padding:16px 20px;
  border-radius:18px;
  box-shadow:0 3px 15px rgba(255,150,190,.08)
}

.products-page{padding-top:20px}

.page-top{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:15px
}

.back-button{
  border:0;
  background:#fff0f6;
  color:#d77fa3;
  padding:10px 14px;
  border-radius:13px
}

.page-title{
  font-size:21px;
  font-weight:bold;
  color:#d77fa3
}

.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:12px 0
}

.category{
  border:1px solid #f3d4e1;
  background:#fff;
  color:#9b7d8a;
  border-radius:20px;
  padding:9px 15px;
  white-space:nowrap
}

.category.active{
  background:#f6a4c5;
  color:#fff
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
  gap:15px
}

.product{
  background:#fff;
  padding:10px;
  border-radius:20px;
  box-shadow:0 4px 15px rgba(255,150,190,.09);
  overflow:hidden
}

.product-image-wrap{
  width:100%;
  aspect-ratio:1/1;
  overflow:hidden;
  border-radius:15px;
  background:#fff0f6
}

.product-image{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block
}

.product-name{
  font-size:14px;
  font-weight:bold;
  margin:10px 4px 3px
}

.product-category{
  font-size:11px;
  color:#b6a3ab;
  margin:0 4px
}

.product-bottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:10px
}

.price{
  color:#df7ca4;
  font-weight:bold
}

.add{
  border:0;
  background:#f5a0c2;
  color:#fff;
  border-radius:12px;
  padding:8px 12px
}

.cart-panel{
  position:fixed;
  right:0;
  top:0;
  width:380px;
  height:100vh;
  background:#fff;
  z-index:150;
  padding:22px;
  transform:translateX(100%);
  transition:.3s;
  box-shadow:-5px 0 25px rgba(80,40,60,.12);
  display:flex;
  flex-direction:column
}

.cart-panel.open{transform:translateX(0)}

.cart-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:20px;
  font-weight:bold
}

.cart-close{
  border:0;
  background:#fff0f6;
  color:#d681a5;
  width:35px;
  height:35px;
  border-radius:12px
}

.cart-list{
  flex:1;
  overflow-y:auto;
  margin-top:15px
}

.cart-item{
  display:flex;
  gap:10px;
  padding:10px 0;
  border-bottom:1px dashed #eadbe2
}

.cart-image{
  width:55px;
  height:55px;
  border-radius:12px;
  object-fit:cover
}

.cart-info{flex:1}

.cart-name{
  font-size:13px;
  font-weight:bold
}

.cart-price{
  color:#df7ca4;
  font-size:12px;
  margin-top:4px
}

.quantity{
  display:flex;
  align-items:center;
  gap:6px;
  margin-top:6px
}

.quantity button{
  width:24px;
  height:24px;
  border:0;
  border-radius:8px;
  background:#ffe5ef;
  color:#d97c9f
}

.delete-item{
  border:0;
  background:none;
  color:#bca7b0
}

.summary{
  border-top:1px dashed #e2d2da;
  padding-top:15px
}

.summary-row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  margin:8px 0;
  font-size:13px
}

.total{
  color:#df77a2;
  font-size:19px;
  font-weight:bold
}

.checkout,
.modal-button{
  width:100%;
  border:0;
  padding:14px;
  border-radius:17px;
  margin-top:12px;
  background:#f49bc0;
  color:#fff;
  font-weight:bold
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(70,40,55,.28);
  z-index:300;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px
}

.modal.show{display:flex}

.modal-box{
  width:100%;
  max-width:470px;
  max-height:90vh;
  overflow-y:auto;
  background:#fff;
  border-radius:25px;
  padding:25px
}

.modal-title{
  font-size:21px;
  font-weight:bold;
  color:#d77fa3;
  margin-bottom:18px
}

.input{
  width:100%;
  padding:13px;
  border:1px solid #f0dce5;
  outline:0;
  border-radius:13px;
  margin:5px 0 10px
}

.modal-button{
  border-radius:15px;
  margin-top:8px
}

.cancel-button{
  background:#fff0f5;
  color:#bd8fa2
}

.dm-link{
  display:block;
  text-decoration:none;
  text-align:center;
  background:#fff7fa;
  border:1px solid #f0dce5;
  color:#806b74;
  padding:14px;
  border-radius:14px;
  margin:10px 0;
  font-weight:bold
}

.dm-link:hover{background:#ffe4ef}

.copy-row{
  display:flex;
  gap:8px;
  align-items:center;
  margin:8px 0 14px
}

.copy-value{
  flex:1;
  background:#fff7fa;
  border:1px solid #f0dce5;
  padding:12px;
  border-radius:12px;
  word-break:break-all
}

.copy-btn{
  border:0;
  background:#ffe4ef;
  color:#c97e9d;
  padding:11px 12px;
  border-radius:12px
}

.payment-card{
  background:#fffafd;
  border:1px solid #f0dce5;
  border-radius:18px;
  padding:16px;
  margin-bottom:12px
}

.qr{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:15px;
  background:#fff0f6
}

.slip-preview{
  width:100%;
  max-height:300px;
  object-fit:contain;
  border-radius:15px;
  margin-top:10px;
  background:#fff7fa
}

.confirm-disabled{
  opacity:.45;
  cursor:not-allowed
}

.admin-section{
  border-top:1px dashed #ead9e1;
  margin-top:18px;
  padding-top:15px
}

.admin-row{
  display:flex;
  gap:7px;
  align-items:center;
  margin-bottom:8px
}

.admin-row input{
  flex:1;
  padding:10px;
  border:1px solid #f0dce5;
  border-radius:12px;
  outline:0
}

.admin-row button{
  border:0;
  padding:10px 12px;
  border-radius:11px;
  background:#ffe4ef;
  color:#c97e9d
}

.printer-wrap{
  position:relative;
  width:100%;
  height:390px;
  overflow:hidden;
  background:#fff7fb;
  border-radius:18px;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding-top:58px
}

.printer-machine{
  position:absolute;
  top:12px;
  width:240px;
  height:75px;
  border-radius:14px 14px 8px 8px;
  background:#eadde2;
  box-shadow:0 5px 12px rgba(80,40,60,.12);
  z-index:3
}

.printer-slot{
  position:absolute;
  left:20px;
  right:20px;
  bottom:-4px;
  height:12px;
  background:#665761;
  border-radius:4px
}

.receipt-paper{
  position:absolute;
  top:55px;
  width:205px;
  min-height:280px;
  background:#fff;
  border:1px solid #eadbe2;
  padding:18px 14px;
  font-family:Arial,sans-serif;
  font-size:11px;
  color:#444;
  box-shadow:0 3px 10px rgba(80,40,60,.08);
  z-index:2;
  transform:translateY(-205px);
  transition:transform 1.8s cubic-bezier(.22,.61,.36,1);
  touch-action:none;
  user-select:none
}

.printer-wrap.printing .receipt-paper{
  transform:translateY(15px)
}

.receipt-paper.dragging{
  transition:none;
  cursor:grabbing
}

.barcode{
  height:42px;
  margin:8px auto;
  width:145px;
  display:flex;
  align-items:stretch;
  justify-content:center;
  gap:2px;
  overflow:hidden
}

.barcode i{
  display:block;
  background:#222;
  height:100%
}

.receipt-table{
  width:100%;
  border-collapse:collapse;
  font-size:10px
}

.receipt-table td{
  padding:3px 0;
  vertical-align:top
}

.receipt-table td:nth-child(2){
  text-align:center
}

.receipt-table td:last-child{
  text-align:right
}

.receipt-rule{
  border-top:1px solid #222;
  margin:8px 0
}

.receipt-drag-hint{
  text-align:center;
  font-size:10px;
  color:#aaa;
  margin-top:5px
}

.admin-menu{
  display:grid;
  gap:10px
}

.settings-page{
  padding-top:20px
}

.settings-card{
  background:#fff;
  border:1px solid #f0dce5;
  border-radius:18px;
  padding:16px;
  margin-bottom:12px
}

.settings-card h3{
  margin:0 0 6px;
  color:#d77fa3
}

.settings-card p{
  margin:0;
  color:#a18c96;
  font-size:12px
}

textarea.input{
  resize:vertical
}

.product-admin-card{
  display:flex;
  gap:10px;
  align-items:center;
  background:#fff;
  border:1px solid #f0dce5;
  border-radius:15px;
  padding:10px;
  margin-bottom:8px
}

.product-admin-card img{
  width:55px;
  height:55px;
  border-radius:10px;
  object-fit:cover
}

.product-admin-info{
  flex:1;
  min-width:0
}

.product-admin-name{
  font-weight:bold;
  font-size:13px;
  overflow-wrap:anywhere
}

.product-admin-price{
  font-size:12px;
  color:#df7ca4;
  margin-top:3px
}

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:72px;
  background:#fff;
  border-top:1px solid #eadbe2;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  z-index:120
}

.bottom-nav button{
  border:0;
  background:#fff;
  color:#a58f98;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  font-size:10px
}

.bottom-nav button.active{
  color:#df7ca4
}

.bottom-nav svg{
  width:22px;
  height:22px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round
}

.detail-image{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:18px;
  background:#fff0f6
}

.detail-category{
  font-size:11px;
  color:#b59ea8;
  margin-top:10px
}

.detail-name{
  font-size:22px;
  font-weight:bold;
  color:#6f5a64;
  margin-top:4px
}

.detail-description{
  white-space:pre-wrap;
  line-height:1.7;
  color:#806f77;
  margin-top:12px;
  overflow-wrap:anywhere
}

.example-button{
  display:block;
  text-align:center;
  text-decoration:none;
  padding:12px;
  border-radius:14px;
  background:#fff0f6;
  color:#d77fa3;
  font-weight:bold;
  margin-top:12px
}

@media(max-width:700px){
  .home-links{
    gap:6px;
    padding:12px
  }

  .home-link-btn{
    font-size:11px;
    padding:11px 4px
  }

  .cart-panel{
    width:100%
  }

  .products{
    grid-template-columns:repeat(2,1fr);
    gap:10px
  }
}

@media(min-width:701px){
  .bottom-nav{
    left:50%;
    transform:translateX(-50%);
    max-width:700px;
    border-radius:20px 20px 0 0
  }
}
</style>
</head>

<body>

<div id="app"></div>

<div id="sideMenu" class="side-menu">
  <div class="menu-title">
    <span>เมนู</span>
    <button class="close-menu" onclick="closeMenu()">×</button>
  </div>

  <button class="menu-item" onclick="showHome();closeMenu()">
    หน้าร้าน
  </button>

  <button class="menu-item" onclick="showProducts();closeMenu()">
    สินค้าทั้งหมด
  </button>

  <button class="menu-item" onclick="openDM();closeMenu()">
    ติดต่อ
  </button>

  <button class="menu-item" onclick="showAdminSettings();closeMenu()">
    ตั้งค่า
  </button>
</div>

<div id="cartPanel" class="cart-panel">
  <div class="cart-header">
    <span>รถเข็น</span>
    <button class="cart-close" onclick="closeCart()">×</button>
  </div>

  <div id="cartList" class="cart-list"></div>
  <div id="cartSummary"></div>
</div>

<div id="modal" class="modal">
  <div id="modalBox" class="modal-box"></div>
</div>

<div class="bottom-nav">

  <button id="navHome" onclick="showHome()" class="active">
    <svg viewBox="0 0 24 24">
      <path d="M3 10.5 12 3l9 7.5"/>
      <path d="M5.5 9.5V21h13V9.5"/>
      <path d="M9.5 21v-6h5v6"/>
    </svg>
    <span>หน้าร้าน</span>
  </button>

  <button id="navProducts" onclick="showProducts()">
    <svg viewBox="0 0 24 24">
      <path d="M6 5h12l1 16H5L6 5Z"/>
      <path d="M9 5a3 3 0 0 1 6 0"/>
    </svg>
    <span>สินค้า</span>
  </button>

  <button id="navCart" onclick="openCart()" class="cart-nav-wrap">
    <svg viewBox="0 0 24 24">
      <path d="M4 5h2l2 11h10l2-8H7"/>
      <circle cx="10" cy="20" r="1"/>
      <circle cx="18" cy="20" r="1"/>
    </svg>
    <span>รถเข็น</span>
    <span id="cartBadge" class="cart-badge">0</span>
  </button>

  <button id="navContact" onclick="openDM()">
    <svg viewBox="0 0 24 24">
      <path d="M4 5.5A3.5 3.5 0 0 1 7.5 2h9A3.5 3.5 0 0 1 20 5.5v7a3.5 3.5 0 0 1-3.5 3.5H11l-4.5 4v-4.1A3.5 3.5 0 0 1 4 12.5v-7Z"/>
      <path d="M8 8h8M8 11h5"/>
    </svg>
    <span>ติดต่อ</span>
  </button>

</div>

<script>
function readJSON(key,fallback){
  try{
    const raw=localStorage.getItem(key);
    return raw?JSON.parse(raw):fallback
  }catch(e){
    console.warn("Reset invalid local data:",key,e);
    return fallback
  }
}

const defaults={
  name:"Akines shop",
  avatar:"",
  banner:"",
  bankName:"ชื่อธนาคาร",
  bankNumber:"000-000-00000",
  walletName:"True money",
  walletNumber:"000-000-0000",
  paymentNote:"ข้อความ",
  qr:"",
  categories:["ทั้งหมด","Digital","Art","Other"],
  homeLinks:[
    {label:"ex work",url:"#"},
    {label:"check q",url:"#"},
    {label:"credit",url:"#"}
  ]
};

let shop={
  ...defaults,
  ...(readJSON("shopData",{})||{})
};

let products=readJSON("products",[
  {
    id:1,
    name:"สินค้า A",
    price:99,
    category:"Digital",
    image:"",
    description:"รายละเอียดสินค้า A",
    exampleLink:""
  },
  {
    id:2,
    name:"สินค้า B",
    price:99,
    category:"Art",
    image:"",
    description:"รายละเอียดสินค้า B",
    exampleLink:""
  }
]);

let cart=readJSON("cartData",[]);
let selectedSlip="";

if(!Array.isArray(products))products=[];
if(!Array.isArray(cart))cart=[];

if(!Array.isArray(shop.categories)||!shop.categories.length){
  shop.categories=[...defaults.categories]
}

if(!Array.isArray(shop.homeLinks)){
  shop.homeLinks=[...defaults.homeLinks]
}

let currentCategory="ทั้งหมด";
let searchText="";

function saveAll(){
  localStorage.setItem("shopData",JSON.stringify(shop));
  localStorage.setItem("products",JSON.stringify(products));
  localStorage.setItem("cartData",JSON.stringify(cart));
}

function escapeHtml(value){
  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;")
}

function showModal(html){
  document.getElementById("modalBox").innerHTML=html;
  document.getElementById("modal").classList.add("show")
}

function closeModal(){
  document.getElementById("modal").classList.remove("show")
}

function openMenu(){
  document.getElementById("sideMenu").classList.add("open")
}

function closeMenu(){
  document.getElementById("sideMenu").classList.remove("open")
}

function openCart(){
  renderCart();
  document.getElementById("cartPanel").classList.add("open")
}

function closeCart(){
  document.getElementById("cartPanel").classList.remove("open")
}

function setActiveNav(id){
  document.querySelectorAll(".bottom-nav button").forEach(b=>{
    b.classList.remove("active")
  });

  const el=document.getElementById(id);
  if(el)el.classList.add("active")
}

function renderShop(){
  const banner=document.getElementById("profileBanner");

  if(banner){
    if(shop.banner){
      banner.style.backgroundImage=
        `url("${shop.banner}")`
    }else{
      banner.style.backgroundImage="none"
    }
  }

  const avatar=document.querySelector(".profile-avatar");

  if(avatar){
    if(shop.avatar){
      avatar.src=shop.avatar;
      avatar.style.display="block"
    }else{
      avatar.style.display="none"
    }
  }
}

function renderProducts(){
  const box=document.getElementById("productList");
  if(!box)return;

  const search=String(searchText||"").toLowerCase();

  const filtered=products.filter(p=>{
    const matchCategory=
      currentCategory==="ทั้งหมด"||
      p.category===currentCategory;

    const matchSearch=
      String(p.name||"").toLowerCase().includes(search);

    return matchCategory&&matchSearch
  });

  box.innerHTML=filtered.length
    ? filtered.map(p=>`
      <div class="product">

        <button
          style="border:0;background:none;padding:0;width:100%;text-align:left"
          onclick="openProductDetail(${p.id})"
        >
          <div class="product-image-wrap">
            ${
              p.image
              ? `<img class="product-image" src="${escapeHtml(p.image)}" alt="${escapeHtml(p.name)}">`
              : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#d8b7c5">รูปสินค้า</div>`
            }
          </div>

          <div class="product-name">
            ${escapeHtml(p.name)}
          </div>

          <div class="product-category">
            ${escapeHtml(p.category)}
          </div>
        </button>

        <div class="product-bottom">
          <div class="price">
            ${Number(p.price||0).toLocaleString()} ฿
          </div>

          <button
            class="add"
            onclick="addToCart(${p.id})"
          >
            ใส่ตะกร้า
          </button>
        </div>

      </div>
    `).join("")
    : `
      <div style="grid-column:1/-1;text-align:center;padding:40px;color:#b8a4ad">
        ไม่พบสินค้า
      </div>
    `
}

      >

      : `<div class="detail-image" style="display:flex;align-items:center;justify-content:center;color:#d8b7c5">รูปสินค้า</div>`
    }

    </div>

    </button>
  `)
}

function addToCart(id){
  const p=products.find(x=>x.id===id);
  if(!p)return;

  const existing=cart.find(x=>x.id===id);

  if(existing){
    existing.quantity++
  }else{
    cart.push({
      ...p,
      quantity:1
    })
  }

  saveAll();
  renderCart();
  updateCartBadge();
}

function changeQuantity(id,amount){
  const item=cart.find(x=>x.id===id);
  if(!item)return;

  item.quantity+=amount;

  if(item.quantity<=0){
    cart=cart.filter(x=>x.id!==id)
  }

  saveAll();
  renderCart();
  updateCartBadge()
}

function removeFromCart(id){
  cart=cart.filter(x=>x.id!==id);
  saveAll();
  renderCart();
  updateCartBadge()
}

function updateCartBadge(){
  const badge=document.getElementById("cartBadge");

  if(!badge)return;

  const total=cart.reduce(
    (sum,item)=>sum+Number(item.quantity||0),
    0
  );

  badge.textContent=total
}

function renderCart(){
  const list=document.getElementById("cartList");
  const summary=document.getElementById("cartSummary");

  if(!list||!summary){
    updateCartBadge();
    return
  }

  if(!cart.length){
    list.innerHTML=`
      <div style="text-align:center;padding:40px;color:#b8a4ad">
        ยังไม่มีสินค้าในรถเข็น
      </div>
    `;

    summary.innerHTML="";
    updateCartBadge();
    return
  }

  list.innerHTML=cart.map(item=>`
    <div class="cart-item">

      ${
        item.image
        ? `<img class="cart-image" src="${escapeHtml(item.image)}" alt="">`
        : `<div class="cart-image" style="display:flex;align-items:center;justify-content:center;background:#fff0f6;color:#d8b7c5">รูป</div>`
      }

      <div class="cart-info">

        <div class="cart-name">
          ${escapeHtml(item.name)}
        </div>

        <div class="cart-price">
          ${Number(item.price||0).toLocaleString()} ฿
        </div>

        <div class="quantity">
          <button onclick="changeQuantity(${item.id},-1)">−</button>
          <span>${item.quantity}</span>
          <button onclick="changeQuantity(${item.id},1)">＋</button>

          <button
            class="delete-item"
            onclick="removeFromCart(${item.id})"
          >
            ลบ
          </button>
        </div>

      </div>

      <div style="font-size:12px;font-weight:bold">
        ${(item.price*item.quantity).toLocaleString()} ฿
      </div>

    </div>
  `).join("");

  const amount=cart.reduce(
    (sum,item)=>sum+item.quantity,
    0
  );

  const total=cart.reduce(
    (sum,item)=>sum+item.price*item.quantity,
    0
  );

  summary.innerHTML=`
    <div class="summary">

      <div class="summary-row">
        <span>จำนวนสินค้า</span>
        <span>${amount}</span>
      </div>

      <div class="summary-row total">
        <span>รวม</span>
        <span>${total.toLocaleString()} ฿</span>
      </div>

      <button
        class="checkout"
        onclick="openCheckout()"
      >
        ชำระเงิน
      </button>

    </div>
  `;

  updateCartBadge()
}

function readFile(file,callback){
  if(!file){
    callback(null);
    return
  }

  const reader=new FileReader();

  reader.onload=e=>callback(e.target.result);

  reader.readAsDataURL(file)
}

function saveShopSettings(){
  shop.name=document.getElementById("shopName").value.trim();

  const avatarFile=document.getElementById("shopAvatar").files[0];
  const bannerFile=document.getElementById("shopBanner").files[0];

  let pending=0;

  if(avatarFile)pending++;
  if(bannerFile)pending++;

  function done(){
    pending--;

    if(pending<=0){
      saveAll();
      showShopSettings()
    }
  }

  if(avatarFile){
    readFile(avatarFile,img=>{
      shop.avatar=img;
      done()
    })
  }

  if(bannerFile){
    readFile(bannerFile,img=>{
      shop.banner=img;
      done()
    })
  }

  if(!pending){
    saveAll();
    showShopSettings()
  }
}

function saveHomeLinks(){
  shop.homeLinks=shop.homeLinks.map((l,i)=>({
    label:document.getElementById(`homeLabel${i}`).value,
    url:document.getElementById(`homeUrl${i}`).value
  }));

  saveAll();
  alert("บันทึกแล้ว");
  showShopSettings()
}

function addCategory(){
  const input=document.getElementById("newCategory");
  const name=input.value.trim();

  if(!name)return;

  if(shop.categories.includes(name)){
    alert("มีหมวดหมู่นี้อยู่แล้ว");
    return
  }

  shop.categories.push(name);

  saveAll();
  showCategorySettings()
}

function saveCategory(index){
  const categories=shop.categories.filter(c=>c!=="ทั้งหมด");
  const old=categories[index];

  const value=document.getElementById(`cat${index}`).value.trim();

  if(!value)return;

  const realIndex=shop.categories.indexOf(old);

  if(realIndex!==-1){
    shop.categories[realIndex]=value
  }

  products.forEach(p=>{
    if(p.category===old)p.category=value
  });

  saveAll();
  showCategorySettings()
}

function deleteCategory(index){
  const categories=shop.categories.filter(c=>c!=="ทั้งหมด");
  const name=categories[index];

  if(!name)return;

  if(!confirm(`ต้องการลบหมวดหมู่ ${name} หรือไม่?`))return;

  shop.categories=shop.categories.filter(c=>c!==name);

  products.forEach(p=>{
    if(p.category===name){
      p.category="Other"
    }
  });

  saveAll();
  showCategorySettings()
}

function addProduct(){
  const n=document.getElementById("productName").value.trim();
  const price=Number(document.getElementById("productPrice").value);
  const cat=document.getElementById("productCategory").value;
  const description=document.getElementById("productDescription").value;
  const exampleLink=document.getElementById("productExampleLink").value.trim();
  const file=document.getElementById("productImage").files[0];

  if(!n||!price||!file){
    alert("กรุณากรอกข้อมูลให้ครบ");
    return
  }

  readFile(file,img=>{
    products.push({
      id:Date.now(),
      name:n,
      price,
      category:cat,
      image:img,
      description,
      exampleLink
    });

    saveAll();
    renderProducts();
    renderHomeGrid();
    showAdminSettings()
  })
}

function saveEditedProduct(id){
  const p=products.find(x=>x.id===id);

  if(!p)return;

  p.name=document.getElementById("editProductName").value;
  p.price=Number(document.getElementById("editProductPrice").value);
  p.category=document.getElementById("editProductCategory").value;
  p.description=document.getElementById("editProductDescription").value;
  p.exampleLink=document.getElementById("editProductExampleLink").value.trim();

  readFile(
    document.getElementById("editProductImage").files[0],
    img=>{
      if(img)p.image=img;

      saveAll();
      renderProducts();
      renderHomeGrid();
      showProductSettings()
    }
  )

function copyText(text){
  if(navigator.clipboard&&window.isSecureContext){
    navigator.clipboard.writeText(text)
      .then(()=>alert("คัดลอกแล้ว"))
  }else{
    const t=document.createElement("textarea");
    t.value=text;
    document.body.appendChild(t);
    t.select();
    document.execCommand("copy");
    t.remove();
    alert("คัดลอกแล้ว")
  }
}

function previewSlip(e){
  const file=e.target.files[0];

  if(!file){
    selectedSlip="";
    return
  }

  if(!file.type.startsWith("image/")){
    alert("กรุณาแนบไฟล์รูปภาพเท่านั้น");
    e.target.value="";
    return
  }

  const r=new FileReader();

  r.onload=x=>{
    selectedSlip=x.target.result;

    document.getElementById("slipPreview").innerHTML=`
      <img
        class="slip-preview"
        src="${selectedSlip}"
        alt="สลิป"
      >
    `;

    const b=document.getElementById("confirmOrderBtn");

    b.disabled=false;
    b.classList.remove("confirm-disabled")
  };

  r.readAsDataURL(file)
}

function enableReceiptDrag(){

  const paper=
    document.getElementById("receiptPaper");

  const wrap=
    document.getElementById("printerWrap");

  if(!paper||!wrap)return;

  let startY=0;
  let startX=0;
  let baseY=0;
  let drag=false;

  const down=e=>{
    drag=true;

    paper.classList.add("dragging");

    const p=e.touches
      ?e.touches[0]
      :e;

    startY=p.clientY;
    startX=p.clientX;

    const m=
      paper.style.transform.match(
        /translate\((-?\d+(?:\.\d+)?)px,\s*(-?\d+(?:\.\d+)?)px\)/
      );

    baseY=m
      ?Number(m[2])
      :0
  };

  const move=e=>{

    if(!drag)return;

    const p=e.touches
      ?e.touches[0]
      :e;

    const dy=
      p.clientY-startY;

    paper.style.transform=
      `translate(0,${baseY+dy}px)`;

    if(e.cancelable)e.preventDefault()
  };

  const up=()=>{

    if(!drag)return;

    drag=false;

    paper.classList.remove("dragging");

    const matrix=
      getComputedStyle(paper).transform;

    let y=0;

    if(matrix&&matrix!=="none"){

      const m=
        matrix.match(/matrix.*\((.+)\)/);

      if(m){
        y=
          Number(
            m[1].split(",")[5]
          )
      }
    }

    if(y>90){

      paper.style.transform=
        `translate(0,180px)`;

      const hint=
        document.querySelector(
          ".receipt-drag-hint"
        );

      if(hint){
        hint.textContent=
          "ดึงใบเสร็จออกแล้ว"
      }

    }else{

      paper.style.transform=
        "translate(0,15px)"
    }
  };

  paper.addEventListener(
    "touchstart",
    down,
    {passive:true}
  );

  paper.addEventListener(
    "touchmove",
    move,
    {passive:false}
  );

  paper.addEventListener(
    "touchend",
    up
  );

  paper.addEventListener(
    "mousedown",
    down
  );

  window.addEventListener(
    "mousemove",
    move
  );

  window.addEventListener(
    "mouseup",
    up
  );
}
